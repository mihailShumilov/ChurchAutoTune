[project]
name = "churchtune"
version = "0.1.0.dev0"
description = "Terminal app that guides church sound volunteers through measuring the room and tuning a Behringer X32 / Midas M32"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "mihail shumilov" }]
keywords = ["audio", "x32", "m32", "room-measurement", "live-sound", "osc"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "typer>=0.27.3",
]

[project.scripts]
ctune = "churchtune.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churchtune"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Claude Code hooks are standalone scripts with their own style; Markdown code blocks are documentation.
extend-exclude = [".claude", "docs", "*.md"]

[tool.ruff.lint]
# Rule sets from docs/CODING_STANDARDS.md §1.
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "PTH", "C4",
    "ARG", "RET", "TRY", "PERF", "NPY", "S", "ANN", "D",
]
ignore = [
    "D105",    # magic methods are documented by the class docstring
    "D107",    # __init__ is documented in the class docstring (google style)
    "N818",    # errors are named by what happened (UnsafeWrite, ReadbackMismatch), CODING_STANDARDS §6
    "TRY003",  # error messages carry context (path, value); a class per message adds nothing
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest works
    "D",        # test names describe the behaviour
    "ANN",      # fixtures and tests are untyped by convention (CODING_STANDARDS §1)
    "PLR2004",  # literal expected values are the point of a test
    "E501",     # tables of test cases read better on one line
    "S104",     # addresses appear as values under test; nothing binds to them
    "PERF",     # clarity over speed in tests
    "ARG",      # fixtures requested for their side effect; fakes implement interfaces they ignore
]
"scripts/**" = [
    "T20",  # scripts print
]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["churchtune"]
branch = true
# Three-line `python -m churchtune` shim; the CLI itself is tested through churchtune.cli.app.
omit = ["*/churchtune/__main__.py"]

[tool.coverage.report]
# Overall gate; per-package gates from SPEC §14.3 are enforced by scripts/check_coverage.py.
fail_under = 80
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

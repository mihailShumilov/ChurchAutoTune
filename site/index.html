<script>
  // Send the visitor to the first supported language in their browser preferences; English otherwise.
  // Without JavaScript the list of links below is shown instead.
  (function () {
    var supported = ["en", "uk", "es"];
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i] || "").toLowerCase().split("-")[0];
      if (supported.indexOf(code) !== -1) {
        location.replace(code + "/");
        return;
      }
    }
    location.replace("en/");
  })();
</script>

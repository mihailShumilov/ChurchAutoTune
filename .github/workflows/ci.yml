name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests run only against the emulator on 127.0.0.1 and the fake audio backend.
  CTUNE_DEV_SAFE: "1"

jobs:
  check:
    name: Lint, types, tests (core, emulator, fake audio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio and libsndfile
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term --cov-report=json
      - run: uv run python scripts/check_coverage.py

  macos-smoke:
    name: macOS smoke (sounddevice import, unit and golden tests)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -c "import sounddevice, soundfile; print(sounddevice.get_portaudio_version())"
      # The golden values were produced on macOS; run them on both platforms.
      - run: uv run pytest tests/unit tests/golden

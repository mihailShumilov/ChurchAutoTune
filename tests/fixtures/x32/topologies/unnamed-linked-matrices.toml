description = "Unnamed matrices: roles from filters and stereo link"
base = "x32_dump_2026-10-02.txt"
model = "X32P"

[overrides]
"mtx/01/config" = '/mtx/01/config "" 66 MG'
"mtx/02/config" = '/mtx/02/config "" 66 MG'
"mtx/03/config" = '/mtx/03/config "" 25 RD'

# Synthetic: the tops are fed straight from Main L / Main R, the sub stays on matrix 3. The
# crossover high-pass has no place on the tops' own path, so it is suggest-only.
description = "Tops on Main L/R, sub on matrix 3"
base = "x32_dump_2026-10-02.txt"
model = "X32P"

[overrides]
"outputs/main/08" = "/outputs/main/08 1 POST OFF"
"outputs/main/07" = "/outputs/main/07 2 POST OFF"

[expected]
variant = "b_tops_on_main_sub_separate"
sub = "matrix 3"
tops = ["main_l", "main_r"]
issues = ["crossover_hpf_suggest_only"]

[expected.outputs]
"main 8" = "top_l"
"main 7" = "top_r"
"main 6" = "sub"
